<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quête UE1 — Procédures DSCG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Press+Start+2P&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#ebe8f8;--pn:#fff;--ink:#1d1b3a;--mu:#5b5883;--ln:#cdc9e8;--gd:#9a6b00;--ok:#1b8a4b;--bd:#c23838;--bt:#2d2a6e;--bi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15132b;--pn:#201e40;--ink:#eeeaff;--mu:#aaa6d3;--ln:#3a376d;--gd:#ffc247;--ok:#4cd68a;--bd:#ff7a7a;--bt:#ffc247;--bi:#1d1b3a}}:root[data-theme=dark]{--bg:#15132b;--pn:#201e40;--ink:#eeeaff;--mu:#aaa6d3;--ln:#3a376d;--gd:#ffc247;--ok:#4cd68a;--bd:#ff7a7a;--bt:#ffc247;--bi:#1d1b3a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
h1{font:14px/1.4 'Press Start 2P',monospace;margin:0}
.pl{text-align:right}.pl b{display:block;font:10px/1.6 'Press Start 2P',monospace;color:var(--gd)}.pl span{font-size:13px;color:var(--mu)}
.lead{color:var(--mu);margin:0 0 18px}
.lv{display:grid;gap:14px}
.lvl{display:grid;gap:4px;text-align:left;padding:16px;background:var(--pn);color:var(--ink);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);font:inherit;cursor:pointer}
.lvl:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.st{font:12px 'Press Start 2P',monospace;color:var(--gd)}
.lvl b{font-size:19px}.lvl small{color:var(--mu)}
.lvl i{display:block;height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:4px}.lvl u{display:block;height:100%;background:var(--ok)}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
.x{background:none;border:2px solid var(--ln);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;font:inherit}
.pg{flex:1;height:10px;border-radius:5px;background:var(--ln);overflow:hidden}.pg u{display:block;height:100%;background:var(--bt);transition:width .3s}
.xp{font:10px 'Press Start 2P',monospace;color:var(--gd)}.cb{font-weight:800;color:var(--ok)}
.card{background:var(--pn);border:2px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:6px 6px 0 var(--dc);animation:pop .25s}
.band{background:var(--dc);color:#fff;padding:9px 14px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.cbody{padding:16px}
.proc{font-size:clamp(20px,5.5vw,28px);line-height:1.25;margin:0 0 6px;font-weight:800}
.bq h3,.bk h3{font-size:13px;color:var(--mu);margin:16px 0 4px}.bq h3 small{color:var(--gd);font-size:12px}
.bk p{margin:2px 0;font-size:15px}.bb{color:var(--mu);font-size:13px}
.o{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:2px solid var(--ln);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.o:disabled{cursor:default}.o:not(:disabled):hover{border-color:var(--ink)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.o.ko{border-color:var(--bd);background:color-mix(in srgb,var(--bd) 20%,transparent)}
.pb{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--bt);color:var(--bi);font:800 16px Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pb:active,.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.sec{background:transparent;color:var(--ink);border:2px solid var(--ln);box-shadow:none}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rb{padding:13px 6px;border:0;border-radius:10px;font:800 15px Nunito,system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.r0{background:#c23838}.r1{background:#b8730a}.r2{background:#1b8a4b}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:9;animation:fade .2s}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;padding:16px;text-align:center}.sum b{display:block;font:16px 'Press Start 2P',monospace;margin-bottom:6px}.sum small{color:var(--mu)}
.up{background:var(--gd);color:var(--bi);padding:10px 14px;border-radius:10px;font-weight:800;text-align:center;margin:10px 0}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
@keyframes fade{from{opacity:0}}
button:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
const D=[{"n": "1.0", "dom": "Droit des sociétés", "sub": "Constitution", "p": "Constitution d'une société commerciale", "q": "Création d'une SARL, SAS, SA, SNC…", "ac": "Associés fondateurs, notaire (apports en nature), greffe du TC, commissaire aux apports", "e": "1. Rédaction des statuts\n2. Évaluation des apports en nature (commissaire aux apports désigné par le président du TC)\n3. Dépôt du capital (banque ou notaire)\n4. Publication d'un avis de constitution dans un JAL\n5. Dépôt du dossier d'immatriculation au greffe du TC\n6. Immatriculation au RCS → naissance de la personnalité morale\n7. Parution au BODACC", "dl": "Publication JAL : dans les 8 jours suivant la signature des statuts", "refs": "C. com. art. L. 210-1 s.", "f": 3}, {"n": "2.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Augmentation de capital par apports en numéraire (SA)", "q": "Besoin de financement externe, entrée d'un nouvel actionnaire dans une SA cotée ou non", "ac": "CA / directoire, actionnaires, CAC, commissaire aux avantages particuliers, commissaire aux apports (si DPS supprimé)", "e": "1. Décision de l'AGE (ou délégation au CA)\n2. Rapport du CA + rapport du CAC sur l'opération\n3. Maintien ou suppression du DPS (AGE à 2/3)\n4. Si DPS maintenu : exercice pendant 5 jours de négociation minimum\n5. Souscription des nouvelles actions et libération (¼ min à la souscription, solde ≤ 5 ans)\n6. Modification des statuts\n7. Publicité + dépôt greffe", "dl": "DPS : période d'exercice ≥ 5 jours de négociation\nLibération du solde : ≤ 5 ans", "refs": "C. com. art. L. 225-127 s.", "f": 3}, {"n": "3.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Augmentation de capital par incorporation de réserves", "q": "Augmentation du capital nominal sans apport nouveau ; souvent accompagnée d'une distribution d'actions gratuites", "ac": "AGO (ou CA si délégation), actionnaires", "e": "1. Décision AGO (majorité simple) ou CA si délégation\n2. Augmentation du nominal OU émission d'actions gratuites attribuées aux actionnaires\n3. Modification des statuts en AGE si changement de capital\n4. Publicité + greffe", "dl": "Aucun délai légal spécifique", "refs": "C. com. art. L. 225-130", "f": 2}, {"n": "4.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Augmentation de capital par apports en nature", "q": "Acquisition d'un bien non monétaire (fonds de commerce, immeuble, brevet…) rémunérée par des titres", "ac": "Apporteur, commissaire aux apports (désigné par le président du TC ou à l'unanimité), AGE", "e": "1. Nomination du commissaire aux apports\n2. Rapport d'évaluation de l'apport\n3. AGE : approbation des évaluations (possibilité de réduire mais accord apporteur requis)\n4. Augmentation de capital + modification des statuts\n5. Publicité + greffe", "dl": "Rapport commissaire disponible 5 jours avant l'AGE (SA)", "refs": "C. com. art. L. 225-147", "f": 2}, {"n": "5.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Réduction de capital non motivée par des pertes", "q": "Excédent de fonds propres, rachat d'actions propres, remboursement d'apports aux actionnaires", "ac": "AGE, CAC, créanciers", "e": "1. Décision AGE\n2. Rapport du CAC\n3. Droit d'opposition des créanciers (20 jours après dépôt au greffe)\n4. Le tribunal peut rejeter l'opposition ou ordonner remboursement / garantie\n5. Publicité + greffe", "dl": "Opposition des créanciers : 20 jours après dépôt au greffe", "refs": "C. com. art. L. 225-204 s.", "f": 2}, {"n": "6.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Réduction de capital motivée par des pertes (assainissement)", "q": "Pertes comptables importantes nécessitant un assainissement du bilan ; souvent couplée à une augmentation (coup d'accordéon)", "ac": "AGE, CAC, actionnaires", "e": "1. Constat des pertes au bilan\n2. Décision AGE\n3. Réduction du capital (suppression d'actions ou réduction du nominal)\n4. Si coup d'accordéon : augmentation simultanée réservée à des tiers ou actionnaires\n5. Rapport du CAC\n6. Publicité + greffe", "dl": "Pas de droit d'opposition des créanciers (motivée par pertes)", "refs": "C. com. art. L. 225-202", "f": 3}, {"n": "7.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Perte de plus de la moitié du capital social", "q": "Pertes au bilan supérieures à la moitié du capital social → obligations légales d'information et de décision", "ac": "Dirigeants, CAC, associés / actionnaires, greffe, président du TC", "e": "1. Constat par le CAC ou les dirigeants à la clôture de l'exercice\n2. Information des actionnaires dans les 4 mois suivant l'approbation des comptes\n3. AGE : décision de dissolution anticipée OU de continuation\n4. Si continuation : obligation de reconstituer les capitaux propres dans les 2 exercices suivants\n5. Si non-respect : tout intéressé peut saisir le tribunal pour dissolution\n6. Publication de la décision au RCS", "dl": "Consultation actionnaires : 4 mois après approbation des comptes\nRégularisation : clôture du 2e exercice suivant\n→ Sanction : dissolution judiciaire possible", "refs": "C. com. art. L. 223-42 (SARL), L. 225-248 (SA)", "f": 3}, {"n": "8.0", "dom": "Droit des sociétés", "sub": "Capital", "p": "Rachat par une SA de ses propres actions", "q": "Programme de rachat (liquidité, annulation, actionnariat salarié, couverture de valeurs mobilières), offre de rachat aux actionnaires", "ac": "AGO, CA, actionnaires, AMF si cotée", "e": "1. Autorisation de l'AGO (durée max 18 mois)\n2. Fixation du prix max de rachat et du nombre max d'actions\n3. Déclaration à l'AMF si cotée\n4. Mise en œuvre par le CA\n5. Affectation : annulation (AGE), cession, attribution aux salariés…\n6. Les actions détenues ne votent pas et ne reçoivent pas de dividendes", "dl": "Autorisation AGO : durée max 18 mois\nFraction max détenue : 10 % du capital", "refs": "C. com. art. L. 225-209 s.", "f": 2}, {"n": "9.0", "dom": "Droit des sociétés", "sub": "Conventions", "p": "Conventions réglementées — SA (conseil d'administration)", "q": "Convention conclue directement ou indirectement entre la SA et un dirigeant, administrateur ou actionnaire > 10 %, ou une société liée", "ac": "Administrateur ou dirigeant intéressé, CA, CAC, AGO, actionnaires", "e": "1. Autorisation préalable du CA (délibération sans le vote de l'intéressé)\n2. Information du CAC par la société\n3. Rapport spécial du CAC présenté à l'AGO\n4. Approbation de l'AGO (vote ; l'intéressé ne vote pas si administrateur mais peut voter si simple actionnaire)\n5. Si non approuvée : convention maintenue mais conséquences préjudiciables supportées par l'intéressé\n6. Les conventions non approuvées peuvent être annulées si elles ont causé un préjudice à la société", "dl": "Rapport du CAC : joint à la convocation de l'AGO\nAnnulation : dans les 3 ans à compter de la convention (ou de sa dissimulation)", "refs": "C. com. art. L. 225-38 s. (CA), L. 225-68 (CS)", "f": 3}, {"n": "10.0", "dom": "Droit des sociétés", "sub": "Conventions", "p": "Conventions réglementées — SARL", "q": "Convention entre la SARL et son gérant, un associé ou une personne interposée (hors opérations courantes à conditions normales)", "ac": "Gérant ou associé intéressé, gérant(s), associés, commissaire aux comptes (si nommé)", "e": "1. Le gérant ou associé intéressé informe le ou les gérants (ou s'il est gérant unique : informe les associés directement)\n2. Le gérant intéressé ne peut approuver lui-même si gérant unique → convocation de l'AG\n3. Établissement d'un rapport spécial sur les conventions (par le gérant ou le CAC s'il y en a un)\n4. Approbation par les associés en AGO (l'intéressé ne vote pas, ses parts ne comptent pas)\n5. Si non approuvée : la convention est maintenue mais ses effets préjudiciables sont à la charge du gérant/associé", "dl": "Approbation en AGO : pas de délai légal spécifique mais impératif de présenter à la prochaine assemblée\nAnnulation : 3 ans (ou dissimulation)", "refs": "C. com. art. L. 223-19 s.", "f": 3}, {"n": "11.0", "dom": "Droit des sociétés", "sub": "Conventions", "p": "Conventions réglementées — SAS", "q": "Convention entre la SAS et son président, un dirigeant ou un associé détenant une fraction du capital > au seuil statutaire", "ac": "Président / dirigeant intéressé, associés, organe de contrôle statutaire le cas échéant", "e": "1. Procédure définie par les statuts (la loi ne précise pas de procédure impérative pour la SAS, sauf pour les SASU)\n2. En pratique : information de l'assemblée + approbation des associés par analogie\n3. Pour la SASU (associé unique = dirigeant) : mention au registre des décisions ou procès-verbal\n4. Rapport du CAC si nommé", "dl": "Délais et conditions = statuts\nPour SASU : pas d'obligation de rapport mais enregistrement de la décision", "refs": "C. com. art. L. 227-10 s.", "f": 2}, {"n": "12.0", "dom": "Droit des sociétés", "sub": "Conventions", "p": "Conventions interdites", "q": "Convention par laquelle un dirigeant ou administrateur emprunte auprès de la société, se fait consentir un découvert ou fait cautionner ses engagements par la société", "ac": "Dirigeant, administrateur, société", "e": "1. Ces conventions sont frappées de NULLITÉ ABSOLUE dès leur conclusion\n2. Aucune autorisation ni approbation ne peut les valider\n3. La nullité est opposable à tous (y compris les tiers de bonne foi)\n4. Action en nullité : par tout associé, la société, le ministère public\n5. La nullité entraîne la restitution des sommes ou avantages perçus", "dl": "Prescription nullité : 3 ans à compter de la conclusion de la convention", "refs": "C. com. art. L. 225-43 (SA), L. 223-21 (SARL)", "f": 3}, {"n": "13.0", "dom": "Droit des sociétés", "sub": "Conventions", "p": "Conventions courantes à conditions normales", "q": "Opérations habituelles de la société conclues à des conditions normales de marché avec un dirigeant ou actionnaire, même intéressé", "ac": "Dirigeant / actionnaire, société", "e": "1. Aucune procédure d'autorisation ni d'approbation requise\n2. Mais obligation pour le dirigeant d'informer le président du CA / CS ou le gérant\n3. Le CAC peut en être informé\n4. Si une convention initialement qualifiée de courante perd ce caractère : requalification en convention réglementée", "dl": "Aucun délai ni formalité obligatoire", "refs": "C. com. art. L. 225-39 (SA), L. 223-20 (SARL)", "f": 2}, {"n": "14.0", "dom": "Droit des sociétés", "sub": "Contrôle légal", "p": "Nomination et révocation du Commissaire aux Comptes (CAC)", "q": "Nomination obligatoire (SA, SCA) ou sur seuils (SARL, SAS) ; révocation ou non-renouvellement en cas de faute ou fin de mandat", "ac": "AGO (nomination), tribunal de commerce (si carence ou récusation), CAC en exercice", "e": "Nomination :\n1. Désignation par l'AGO (ou les statuts pour le 1er CAC)\n2. Durée du mandat : 6 exercices (renouvelable sauf dans les entités d'intérêt public)\n3. Le CAC accepte sa mission et atteste de son indépendance\n\nRévocation :\n1. Révocation pour juste motif uniquement (erreur grave, manquement déontologique)\n2. Décision du président du TC sur requête\n3. Simple non-renouvellement à l'issue du mandat : AGO ordinaire, sans motif", "dl": "Mandat : 6 exercices\nRévocation : saisine du TC (aucun délai légal mais urgence si nécessaire)", "refs": "C. com. art. L. 823-1 s.", "f": 2}, {"n": "15.0", "dom": "Droit des sociétés", "sub": "Contrôle légal", "p": "Rapport spécial du CAC sur les conventions réglementées", "q": "Obligation annuelle du CAC dans toutes les sociétés disposant d'un CAC dès lors qu'une convention réglementée existe", "ac": "CAC, dirigeants, AGO", "e": "1. Le CAC est informé des conventions par les dirigeants (ou les découvre lors de sa mission)\n2. Rapport spécial établi à chaque exercice recensant toutes les conventions réglementées (nouvelles et poursuivies)\n3. Joint à la convocation de l'AGO\n4. Présenté et voté en AGO\n5. Si convention non soumise ou dissimulée : responsabilité du dirigeant", "dl": "Transmission au CAC : dès la connaissance de la convention\nRapport joint à la convocation AGO", "refs": "C. com. art. L. 225-40 (SA), L. 223-19 al. 4 (SARL)", "f": 3}, {"n": "16.0", "dom": "Droit des sociétés", "sub": "Assemblées", "p": "Convocation et tenue d'une AGO (SA)", "q": "Approbation des comptes annuels, affectation du résultat, nomination des administrateurs/CAC, approbation des conventions réglementées", "ac": "CA (ou directoire), actionnaires, CAC, président du TC en cas de carence", "e": "1. Convocation par le CA (15 jours avant, ou 8 jours pour une 2e convocation)\n2. Mise à disposition des documents au siège social 15 jours avant\n3. Envoi de la convocation aux actionnaires\n4. Tenue de l'assemblée : quorum ¼ (1re conv.) ; sans quorum (2e conv.)\n5. Majorité : >50 % des voix exprimées\n6. Rédaction du procès-verbal et dépôt au greffe", "dl": "Tenue : dans les 6 mois suivant la clôture de l'exercice\nConvocation : 15 jours avant (1re) ; 8 jours (2e)\nDocuments disponibles : 15 jours avant", "refs": "C. com. art. L. 225-100 s.", "f": 3}, {"n": "17.0", "dom": "Droit des sociétés", "sub": "Assemblées", "p": "Convocation et tenue d'une AGE (SA)", "q": "Modification des statuts, augmentation/réduction de capital, fusion, scission, transformation, dissolution", "ac": "CA, actionnaires (quorum renforcé), CAC", "e": "1. Convocation par le CA\n2. Documents disponibles 15 jours avant\n3. Quorum : 1/4 des actions sur 1re conv. ; 1/5 sur 2e conv.\n4. Majorité : 2/3 des voix exprimées\n5. PV signé et déposé au greffe", "dl": "Quorum 1re : ¼ ; 2e : 1/5\nMajorité : 2/3", "refs": "C. com. art. L. 225-96 s.", "f": 3}, {"n": "18.0", "dom": "Droit des sociétés", "sub": "Assemblées", "p": "Abus de majorité / abus de minorité", "q": "Vote de l'AGE contraire à l'intérêt social et favorisant les majoritaires (abus de maj.) OU blocage sans motif légitime empêchant une opération nécessaire (abus de min.)", "ac": "Actionnaire(s) victime(s), actionnaire(s) fautif(s), tribunal de commerce", "e": "Abus de majorité :\n1. La résolution adoptée est contraire à l'intérêt social ET profite aux majoritaires au détriment des minoritaires\n2. Action en annulation de la résolution\n3. Action en responsabilité pour dommages-intérêts\n\nAbus de minorité :\n1. Refus sans juste motif d'une opération indispensable (ex. augmentation de capital en cas de pertes)\n2. Le tribunal peut désigner un mandataire pour voter à la place du minoritaire fautif", "dl": "Prescription action en annulation : 3 ans à compter de l'assemblée", "refs": "Jurisprudence (Cass. com.)", "f": 3}, {"n": "19.0", "dom": "Droit des sociétés", "sub": "Restructuration", "p": "Fusion-absorption", "q": "Rapprochement de deux sociétés : l'absorbée est dissoute sans liquidation et transmet l'universalité de son patrimoine à l'absorbante", "ac": "Dirigeants des 2 sociétés, commissaire à la fusion (CAC), actionnaires, créanciers, greffe", "e": "1. Projet de fusion établi et déposé au greffe (+ publication BODACC 30 jours avant AGE)\n2. Rapports du commissaire à la fusion (parité d'échange + valeur des apports)\n3. Approbation par l'AGE de chaque société\n4. Droit d'opposition des créanciers (30 jours après publication)\n5. Réalisation : dissolution sans liquidation de l'absorbée + augmentation de capital de l'absorbante\n6. Publicité et immatriculation modificative", "dl": "Publication projet : ≥ 30 jours avant AGE\nOpposition créanciers : 30 jours après publication", "refs": "C. com. art. L. 236-1 s.", "f": 3}, {"n": "20.0", "dom": "Droit des sociétés", "sub": "Restructuration", "p": "Scission", "q": "Division d'une société en deux ou plusieurs entités nouvelles ou préexistantes", "ac": "Dirigeants, commissaire à la scission, actionnaires, créanciers, greffe", "e": "1. Projet de scission déposé et publié (30 jours avant AGE)\n2. Rapport du commissaire à la scission\n3. AGE dans chaque société concernée\n4. Droit d'opposition des créanciers (30 jours)\n5. Dissolution sans liquidation de la société scindée\n6. Formalités publicité et greffe", "dl": "Mêmes délais que la fusion", "refs": "C. com. art. L. 236-1 s. par renvoi", "f": 2}, {"n": "21.0", "dom": "Droit des sociétés", "sub": "Restructuration", "p": "Apport partiel d'actif (APA)", "q": "Transfert d'une branche autonome d'activité à une autre société en échange de titres, sans dissolution de l'apporteuse", "ac": "Sociétés apporteuse et bénéficiaire, commissaire aux apports, AGE", "e": "1. Contrat d'apport avec évaluation de la branche d'activité\n2. Si soumis au régime des scissions (option) : formalités identiques (AGE, commissaire, publication)\n3. Augmentation de capital de la société bénéficiaire\n4. Formalités publicité et greffe", "dl": "Selon le régime choisi (apport en nature ou scissions)", "refs": "C. com. art. L. 236-22 s.", "f": 2}, {"n": "22.0", "dom": "Droit des sociétés", "sub": "Restructuration", "p": "Transformation de société", "q": "Changement de forme juridique sans création d'un être moral nouveau (ex. SARL → SAS, SNC → SA)", "ac": "Associés / actionnaires, CAC, commissaire à la transformation (selon la forme)", "e": "1. Rapport du CAC sur la situation de la société (actif net ≥ capital social requis dans certains cas)\n2. Rapport du commissaire à la transformation si nécessaire\n3. Décision des associés selon les règles de la forme d'arrivée\n4. Mise à jour des statuts\n5. Publicité et formalités greffe", "dl": "Aucun délai légal spécifique", "refs": "C. com. art. L. 224-1 s.", "f": 2}, {"n": "23.0", "dom": "Droit des sociétés", "sub": "Titres & Associés", "p": "Procédure d'agrément (cession de parts ou actions)", "q": "Cession de parts sociales à des tiers (SARL : toujours) ; cession d'actions avec clause d'agrément (SAS, SA fermée)", "ac": "Cédant, cessionnaire pressenti, gérant / président, associés / actionnaires", "e": "1. Notification de la cession envisagée au gérant (lettre recommandée)\n2. Consultation des associés dans 3 mois (SARL : délai supplétif)\n3. Refus d'agrément → obligation pour les associés, la société ou un tiers agréé de racheter les parts dans 3 mois\n4. Absence de réponse dans les délais = agrément réputé acquis\n5. Si la société rachète : réduction de capital corrélative", "dl": "SARL : réponse dans 3 mois\nSA / SAS : délais statutaires\nRachat obligatoire après refus : 3 mois", "refs": "C. com. art. L. 223-14 (SARL), L. 228-23 (SA), statuts SAS", "f": 3}, {"n": "24.0", "dom": "Droit des sociétés", "sub": "Titres & Associés", "p": "Exclusion d'un associé (SAS)", "q": "Violation d'une obligation statutaire, départ d'un salarié-actionnaire, mésentente grave, clause d'inaliénabilité", "ac": "Associés (selon statuts), président SAS, associé exclu", "e": "1. Existence obligatoire d'une clause d'exclusion dans les statuts\n2. Respect d'une procédure contradictoire (information et défense de l'intéressé — jurisprudence)\n3. Décision conforme aux conditions statutaires\n4. Indemnisation de l'associé exclu sur la base de la valeur des titres\n5. Rachat des titres ou réduction de capital", "dl": "Délais et conditions : statuts", "refs": "C. com. art. L. 227-16", "f": 2}, {"n": "25.0", "dom": "Droit des sociétés", "sub": "Dirigeants", "p": "Révocation du gérant de SARL", "q": "Désaccord des associés, faute de gestion, perte de confiance, changement de stratégie", "ac": "Associés (majorité > ½ des parts), gérant, tribunal si révocation judiciaire", "e": "1. Convocation de l'AGO\n2. Vote : majorité > ½ des parts (1re convocation) ; majorité des votants (2e) sauf statuts plus exigeants\n3. Si révocation sans juste motif → dommages-intérêts (préjudice moral et financier)\n4. Formalités publicité et greffe", "dl": "Aucun préavis légal obligatoire\nAd nutum sauf juste motif", "refs": "C. com. art. L. 223-25", "f": 3}, {"n": "26.0", "dom": "Droit des sociétés", "sub": "Dirigeants", "p": "Révocation du PDG / DG de SA (CA)", "q": "Décision du CA à tout moment, ad nutum, sans motif à fournir (sauf abus de droit)", "ac": "Conseil d'administration", "e": "1. Réunion du CA (quorum et majorité)\n2. Délibération et vote de révocation\n3. Révocation ad nutum : aucun juste motif requis, aucune indemnité légale\n4. Mais protection possible si faute dans les conditions : abus de droit = dommages-intérêts\n5. Formalités publicité et greffe", "dl": "Ad nutum : révocable à tout moment, sans délai ni préavis légal", "refs": "C. com. art. L. 225-47, L. 225-55", "f": 3}, {"n": "27.0", "dom": "Droit des sociétés", "sub": "Dirigeants", "p": "Révocation du Président de SAS", "q": "Conditions exclusivement prévues par les statuts ; la loi ne fixe aucune règle impérative", "ac": "Associés (selon statuts), président SAS", "e": "1. Application stricte des clauses statutaires (conditions, quorum, majorité, procédure)\n2. Si révocation sans respecter les statuts → révocation irrégulière → dommages-intérêts\n3. Formalités publicité et greffe", "dl": "Tout est dans les statuts", "refs": "C. com. art. L. 227-5", "f": 2}, {"n": "28.0", "dom": "Droit des sociétés", "sub": "Dissolution", "p": "Dissolution et liquidation amiable", "q": "Décision des associés (terme statutaire, objet accompli ou éteint, mésentente), dissolution judiciaire", "ac": "Associés, liquidateur(s), greffe, créanciers", "e": "1. Décision de dissolution (AGE ou décision unanime selon forme)\n2. Nomination du ou des liquidateurs\n3. Publication de la dissolution (JAL + BODACC)\n4. Opérations de liquidation : réalisation de l'actif, paiement du passif\n5. Approbation des comptes de liquidation par les associés\n6. Partage du boni de liquidation\n7. Clôture de liquidation + radiation du RCS", "dl": "Durée de la liquidation : max 3 ans (prorogeable)\nRadiation RCS : dans le mois suivant la clôture", "refs": "C. com. art. L. 237-1 s.", "f": 2}, {"n": "29.0", "dom": "Entreprises en difficulté", "sub": "Procédures amiables", "p": "Mandat ad hoc", "q": "Entreprise rencontrant des difficultés (avant état de cessation de paiements) souhaitant une solution discrète et rapide", "ac": "Débiteur (seul à saisir), mandataire ad hoc, créanciers ciblés, président du TC", "e": "1. Requête confidentielle du débiteur au président du TC\n2. Nomination du mandataire ad hoc (praticien désigné par le président)\n3. Mission libre : négociations avec les créanciers, rééchelonnements, accords bilatéraux\n4. Aucune suspension légale des poursuites (sauf accord amiable)\n5. Fin de mission : accord signé ou constat d'échec\n6. Confidentialité totale (pas d'inscription au RCS)", "dl": "Aucun délai légal\nConfidentielle — pas de publication", "refs": "C. com. art. L. 611-3", "f": 2}, {"n": "30.0", "dom": "Entreprises en difficulté", "sub": "Procédures amiables", "p": "Conciliation", "q": "Difficultés économiques, financières ou juridiques avérées ou prévisibles ; cessation des paiements possible si < 45 jours", "ac": "Débiteur, conciliateur, créanciers principaux, président du TC", "e": "1. Requête du débiteur au président du TC\n2. Nomination du conciliateur (durée : 4 mois + 1 mois prorogeable)\n3. Suspension des poursuites possible (pas automatique)\n4. Négociation d'un accord avec les créanciers\n5. Accord constaté (confidentiel) -> force obligatoire OU homologué par le TC (public, protections renforcées) voir condition dans le cours -> force obligatoire que pour le débiteurs\n6. Privilège de conciliation (new money)", "dl": "Mission conciliateur : 4 mois + 1 mois\nCessation des paiements tolérée : ≤ 45 jours\nPrivilège de conciliation : créanciers new money payés en priorité", "refs": "C. com. art. L. 611-4 s.", "f": 3}, {"n": "31.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Procédure de sauvegarde", "q": "Entreprise justifiant de difficultés ne pouvant être surmontées seule, SANS cessation des paiements", "ac": "Débiteur (seul habilité à demander), tribunal de commerce, administrateur judiciaire, mandataire judiciaire, créanciers, CSE", "e": "1. Demande d'ouverture par le débiteur\n2. Jugement d'ouverture → gel du passif antérieur + suspension des poursuites\n3. Période d'observation (6 mois renouvelable 1 fois, max 12 mois + 6 mois exceptionnels)\n4. Bilan économique, social et environnemental par l'administrateur\n5. Élaboration du plan de sauvegarde (remises de dettes, délais de paiement)\n6. Comités de créanciers (si ≥ 250 salariés ou CA > 20 M€) ou consultation individuelle\n7. Arrêté du plan par le tribunal (max 10 ans)\n8. Exécution du plan / clôture", "dl": "Période d'observation : 6 mois renouvelable (max 12 mois, exceptionnellement 18 mois)\nPlan : max 10 ans (15 ans agriculteurs)", "refs": "C. com. art. L. 620-1 s.", "f": 3}, {"n": "32.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Sauvegarde accélérée", "q": "Entreprise en difficulté ayant déjà négocié un accord majoritaire avec ses créanciers lors d'une conciliation ; procédure rapide de mise en œuvre", "ac": "Débiteur, créanciers (comités), tribunal, administrateur judiciaire", "e": "1. Ouverture possible uniquement si conciliation en cours\n2. Jugement d'ouverture rapide\n3. Période d'observation très courte (max 3 mois)\n4. Adoption du plan par les comités de créanciers (majorité 2/3 des voix)\n5. Arrêté du plan par le tribunal\n6. Seuls les créanciers membres des comités sont soumis au plan", "dl": "Période d'observation : max 3 mois\nAccès réservé aux entreprises de grande taille (seuils : ≥ 250 salariés ou CA ≥ 20 M€)", "refs": "C. com. art. L. 628-1 s.", "f": 2}, {"n": "33.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Redressement judiciaire (RJ)", "q": "Entreprise en cessation des paiements dont le redressement est possible", "ac": "Débiteur (ou créancier, ou MP), tribunal, administrateur judiciaire, mandataire judiciaire, créanciers, salariés", "e": "1. Déclaration de cessation des paiements par le débiteur (dans les 45 jours)\n   OU saisine par un créancier / le ministère public\n2. Jugement d'ouverture → suspension des poursuites, gel du passif antérieur\n3. Période d'observation (6 mois renouvelable, max 18 mois)\n4. Bilan économique et social\n5. Plan de redressement (remises, délais) → adoption, exécution\n   OU plan de cession si aucun plan viable\n6. Conversion en LJ si impossible", "dl": "Déclaration de CdP : délai de 45 jours\nPériode d'observation : max 18 mois\nPlan de redressement : max 10 ans", "refs": "C. com. art. L. 631-1 s.", "f": 3}, {"n": "34.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Liquidation judiciaire (LJ)", "q": "Entreprise en cessation des paiements dont le redressement est manifestement impossible", "ac": "Débiteur, tribunal, liquidateur judiciaire, créanciers, salariés, AGS (garantie des salaires)", "e": "1. Jugement d'ouverture (ou conversion depuis RJ)\n2. Dessaisissement du débiteur → liquidateur maître des opérations\n3. Déclaration des créances par les créanciers (2 mois résidents, 4 mois non-résidents)\n4. Vérification et admission des créances par le liquidateur\n5. Réalisation de l'actif (ventes à l'amiable ou aux enchères)\n6. Paiement des créanciers dans l'ordre de priorité (super-privilège salaires, frais de justice, privilèges…)\n7. Clôture : insuffisance d'actif ou apurement du passif\n8. Radiation du RCS", "dl": "Déclaration créances : 2 mois (résidents), 4 mois (non-résidents) à compter de la publication au BODACC\nClôture : délai variable (objectif 2 ans)", "refs": "C. com. art. L. 640-1 s.", "f": 3}, {"n": "35.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Déclaration des créances", "q": "Obligation de tout créancier dont la créance est antérieure au jugement d'ouverture de déclarer sa créance au mandataire / liquidateur", "ac": "Créancier, mandataire judiciaire / liquidateur, juge-commissaire", "e": "1. Publication du jugement d'ouverture au BODACC → point de départ du délai\n2. Déclaration écrite de la créance (montant, nature, garanties) au mandataire / liquidateur\n3. Établissement de l'état des créances par le mandataire\n4. Contestations éventuelles devant le juge-commissaire\n5. Jugement d'admission définitif\n6. Créancier non-déclarant : forclusion (perd son droit sauf relevé possible)", "dl": "Déclaration : 2 mois résidents / 4 mois non-résidents après publication BODACC\nRelevé de forclusion : 6 mois (créancier de bonne foi)", "refs": "C. com. art. L. 622-24 s.", "f": 3}, {"n": "36.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Continuation et résiliation des contrats en cours", "q": "Choix de l'administrateur judiciaire (ou du débiteur en l'absence d'adm.) de continuer ou de résilier les contrats en cours à la date du jugement d'ouverture", "ac": "Administrateur judiciaire, cocontractant, débiteur, juge-commissaire", "e": "1. Le cocontractant met en demeure l'administrateur de se prononcer dans 1 mois\n2. Si l'administrateur choisit la continuation : la prestation doit être payée au fur et à mesure\n3. Si l'administrateur choisit la résiliation : résiliation de plein droit, indemnité du cocontractant (créance antérieure soumise à déclaration)\n4. Absence de réponse dans 1 mois = résiliation\n5. Certains contrats résiliés de plein droit (contrats intuitu personae : mandat, bail commercial sous conditions…)", "dl": "Mise en demeure cocontractant → réponse administrateur : 1 mois\nSi pas de réponse = résiliation", "refs": "C. com. art. L. 622-13", "f": 3}, {"n": "37.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Nullité de la période suspecte", "q": "", "ac": "Liquidateur / mandataire judiciaire, cocontractant, tribunal", "e": "1. Détermination de la date de cessation des paiements par le tribunal (peut remonter 18 mois avant le jugement)\n2. Actes nuls de plein droit (nullités absolues) :\n   - Paiements anormaux (espèces, compensation…)\n   - Actes à titre gratuit\n   - Constitution de sûretés sans contrepartie\n   - Levée d'option de crédit-bail sans lien avec l'activité\n3. Actes annulables (nullités facultatives) : paiements de dettes non échues, actes à titre onéreux avec déséquilibre\n4. Action en nullité par le liquidateur devant le tribunal", "dl": "Période suspecte : entre la date de CdP et le jugement d'ouverture (max 18 mois en arrière)\nPrescription action en nullité : 3 ans à compter du jugement d'ouverture", "refs": "C. com. art. L. 632-1 s.", "f": 3}, {"n": "38.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Plan de cession (dans le cadre du RJ)", "q": "Aucun plan de redressement viable ; un repreneur extérieur propose de reprendre tout ou partie de l'activité", "ac": "Tribunal, administrateur judiciaire, repreneur(s), créanciers, salariés (CSE)", "e": "1. Appel à candidatures / offres de reprise déposées auprès de l'administrateur\n2. Audition des candidats par le tribunal\n3. Jugement arrêtant le plan de cession (actifs repris, contrats, salariés transférés)\n4. Transfert des actifs et des contrats en cours sélectionnés\n5. Répartition du prix de cession aux créanciers (ordre de privilèges)\n6. Liquidation pour le passif résiduel", "dl": "Offres déposées pendant la période d'observation\nTransfert des salariés : selon plan (article L. 1224-1 si entité économique autonome)", "refs": "C. com. art. L. 642-1 s.", "f": 2}, {"n": "39.0", "dom": "Entreprises en difficulté", "sub": "Procédures collectives", "p": "Extension de procédure collective (confusion de patrimoine / fictivité)", "q": "Deux entités liées (société mère-filiale, ou sociétés fictives) dont les patrimoines sont confondus ou dont l'une est fictive", "ac": "Liquidateur, mandataire judiciaire, tribunal de commerce", "e": "1. Action en extension par le liquidateur (ou mandataire) devant le tribunal\n2. Caractérisation de la confusion de patrimoines (flux financiers anormaux, absence d'autonomie…) ou de la fictivité\n3. Jugement d'extension : la procédure s'étend à la société liée\n4. Unicité de la procédure et masse commune des créanciers", "dl": "Prescription : 3 ans à compter du jugement d'ouverture", "refs": "C. com. art. L. 621-2 al. 2", "f": 2}, {"n": "40.0", "dom": "Entreprises en difficulté", "sub": "Responsabilité", "p": "Action en insuffisance d'actif", "q": "LJ clôturée pour insuffisance d'actif ; faute(s) de gestion ayant contribué à l'insuffisance d'actif", "ac": "Liquidateur judiciaire, dirigeant mis en cause, tribunal de commerce", "e": "1. Ouverture pendant la LJ ou dans 3 ans après la clôture pour insuffisance d'actif\n2. Assignation du dirigeant par le liquidateur\n3. Preuve d'une faute de gestion + lien de causalité avec l'insuffisance d'actif\n4. Condamnation possible au comblement partiel ou total du passif (solidaire si plusieurs dirigeants)\n5. Peut s'accompagner de faillite personnelle ou d'interdiction de gérer", "dl": "Prescription : 3 ans à compter du jugement de LJ", "refs": "C. com. art. L. 651-2", "f": 3}, {"n": "41.0", "dom": "Entreprises en difficulté", "sub": "Responsabilité", "p": "Faillite personnelle et interdiction de gérer", "q": "Fautes graves du dirigeant (détournement d'actif, comptabilité irrégulière, absence de coopération…)", "ac": "Tribunal de commerce, dirigeant, liquidateur / mandataire", "e": "1. Prononcé par le tribunal lors de la LJ ou du RJ\n2. Faillite personnelle : interdiction de diriger, gérer, administrer ou contrôler toute entreprise\n3. Durée : fixée par le tribunal (pas de plafond légal mais pratique : souvent 5-15 ans)\n4. Interdiction de gérer (alternative) : même effet mais réservée à certaines fautes moins graves", "dl": "Durée fixée par le tribunal\nInscription au fichier national des interdictions de gérer", "refs": "C. com. art. L. 653-1 s.", "f": 2}, {"n": "42.0", "dom": "Entreprises en difficulté", "sub": "Alerte", "p": "Procédure d'alerte du Commissaire aux Comptes (CAC)", "q": "Faits de nature à compromettre la continuité de l'exploitation détectés lors de la mission d'audit", "ac": "CAC, dirigeants (gérant / CA / directoire), organe délibérant, président du TC, assemblée générale", "e": "1er acte : Le CAC informe par écrit le dirigeant → réponse attendue dans 15 jours\n2e acte (si réponse insuffisante) : Le CAC invite le CA / CS / gérant à délibérer sur les faits signalés\n3e acte (si persistance) : Le CAC informe le président du tribunal de commerce\n4e acte (si toujours aucune mesure) : Le CAC informe l'AGO\nFin de la procédure : mesures correctives prises OU ouverture d'une procédure collective", "dl": "1er acte → réponse dirigeant : 15 jours\n2e acte : délibération CA dans 8 jours de la saisine", "refs": "C. com. art. L. 234-1 (SA), L. 223-36 (SARL)", "f": 3}, {"n": "43.0", "dom": "Droit fiscal", "sub": "TVA", "p": "Déclaration et paiement de la TVA (régime réel normal)", "q": "CA > seuils du RSI ; ou entreprises ayant opté pour le RN ; opérations soumises à la TVA", "ac": "Entreprise redevable, DGFiP", "e": "1. Calcul mensuel : TVA collectée (sur ventes) - TVA déductible (sur achats / immobilisations)\n2. Télédéclaration CA3 sur impots.gouv.fr\n3. Télépaiement simultané\n4. Report du crédit de TVA ou demande de remboursement (mensuel si > 760 €)\n5. Trimestriel possible si TVA annuelle < 4 000 €", "dl": "Déclaration & paiement : le mois suivant la période (≈ avant le 24 du mois)\nRemboursement crédit : délai instruction ~30 jours", "refs": "CGI art. 287 ; BOFiP", "f": 3}, {"n": "44.0", "dom": "Droit fiscal", "sub": "TVA", "p": "Déclaration et paiement de la TVA (régime simplifié d'imposition — RSI)", "q": "CA compris dans les seuils du RSI (≈ 85 800 € – 840 000 € pour ventes) ; pas d'option RN", "ac": "Entreprise, DGFiP", "e": "1. Versement de 2 acomptes semestriels calculés sur la TVA de l'exercice précédent\n   - Juillet : 55 % de la TVA N-1\n   - Décembre : 40 % de la TVA N-1\n2. Dépôt de la déclaration annuelle CA12 (avant le 3 mai env.)\n3. Solde payé lors du dépôt de la CA12\n4. Pas d'acompte si TVA due N-1 < 1 000 €", "dl": "Acompte juillet : avant le 24 juillet\nAcompte décembre : avant le 24 décembre\nCA12 : avant le 3 mai (2e jour ouvré suivant le 1er mai)", "refs": "CGI art. 287-3", "f": 2}, {"n": "45.0", "dom": "Droit fiscal", "sub": "TVA", "p": "TVA intracommunautaire", "q": "Achats / ventes de biens entre assujettis de différents États membres de l'UE (échanges B2B)", "ac": "Entreprise française, fournisseur / client UE, DGFiP", "e": "Acquisition intracommunautaire (achat depuis UE) :\n1. Le vendeur facture HT (exonération dans son pays)\n2. L'acheteur français auto-liquide la TVA française : collecte ET déduit simultanément (neutre si récupérable)\n3. Déclaration sur CA3 (lignes dédiées)\n\nLivraison intracommunautaire (vente vers UE) :\n1. Facture HT au client assujetti UE (exonération si client dispose d'un n° TVA intracommunautaire valide)\n2. Vérification du numéro TVA du client (VIES)\n3. Déclaration d'échange de biens (DEB / EMEBI) si > 460 000 € d'expéditions\n\nAuto-liquidation pour prestations de services B2B :\nLieu de taxation = lieu d'établissement du preneur → le preneur auto-liquide", "dl": "DEB / EMEBI : mensuelle si seuil atteint\nDélai vérification n° TVA : avant émission de la facture", "refs": "CGI art. 256 bis, 262 ter, 283-2", "f": 3}, {"n": "46.0", "dom": "Droit fiscal", "sub": "Contrôle fiscal", "p": "Vérification de comptabilité", "q": "Contrôle fiscal en entreprise ; déclenché par l'envoi d'un avis de vérification", "ac": "Vérificateur (inspecteur), entreprise, conseil fiscal", "e": "1. Envoi de l'avis de vérification (≥ 2 jours francs avant la 1re intervention)\n2. 1re intervention sur place (siège social)\n3. Examen des livres, documents comptables et FEC (fichier des écritures comptables)\n4. Débat oral et contradictoire\n5. Fin des opérations sur place\n6. Proposition de rectification (si redressements) envoyée par pli recommandé\n7. Réponse du contribuable dans 30 jours (+ 30 jours prorogeables)\n8. Réponse définitive de l'administration, mise en recouvrement\n9. Recours : hiérarchie, commission des impôts, tribunal administratif / judiciaire", "dl": "Avis de vérification : ≥ 2 jours francs avant la visite\nRéponse à la proposition : 30 jours (+ 30 sur demande)\nPrescription : 31 déc. de la 3e année suivant l'impôt (6 ans en cas de fraude)", "refs": "LPF art. L. 13 s., L. 55 s.", "f": 3}, {"n": "47.0", "dom": "Droit fiscal", "sub": "Contrôle fiscal", "p": "Procédure de rectification contradictoire", "q": "Redressements notifiés après vérification ou contrôle sur pièces ; droits de la défense garantis", "ac": "Contribuable, administration fiscale, commission des impôts directs et des taxes sur le CA", "e": "1. Proposition de rectification envoyée au contribuable (motivée)\n2. Réponse du contribuable dans 30 jours (prorogeable 30 jours)\n3. Réponse de l'administration dans 60 jours\n4. En cas de désaccord persistant sur les faits : saisine de la commission des impôts ou recours hiérarchique\n5. Mise en recouvrement des droits et pénalités\n6. Réclamation contentieuse possible", "dl": "Délai de réponse contribuable : 30 jours (+ 30 sur demande)\nDélai de réponse admin. : 60 jours\nPrescription : 31 décembre de la 3e année", "refs": "LPF art. L. 55 s.", "f": 3}, {"n": "48.0", "dom": "Droit fiscal", "sub": "Contrôle fiscal", "p": "Procédure d'imposition d'office", "q": "Absence de déclaration après mise en demeure, opposition à contrôle, défaut de réponse aux demandes", "ac": "Administration fiscale, contribuable défaillant", "e": "1. Mise en demeure (contribuable a 8 jours pour régulariser)\n2. En l'absence de régularisation → imposition d'office\n3. Pas de procédure contradictoire préalable obligatoire\n4. Charge de la preuve inversée : le contribuable doit prouver l'exagération de l'imposition", "dl": "Mise en demeure : 8 jours pour régulariser\nDélai réponse contribuable après notification : 30 jours", "refs": "LPF art. L. 66 s.", "f": 2}, {"n": "49.0", "dom": "Droit fiscal", "sub": "Contentieux fiscal", "p": "Réclamation contentieuse fiscale", "q": "Contester tout ou partie d'un impôt (trop-perçu, erreur d'application d'un texte)", "ac": "Contribuable, Service des Impôts des Entreprises (SIE), tribunal administratif (IS / TVA) ou TJ (droits d'enregistrement)", "e": "Phase admin. :\n1. Réclamation écrite et motivée adressée au SIE (avant le 31 déc. de la 2e année suivant la mise en recouvrement)\n2. Décision explicite dans 6 mois ou décision implicite de rejet (silence)\nPhase juridictionnelle :\n3. Recours devant le TA (IS, TVA) ou le TJ dans les 2 mois de la décision\n4. Appel devant la CAA ou la Cour d'appel\n5. Pourvoi en cassation devant le CE ou la Cour de cassation", "dl": "Délai de réclamation : 31 déc. de la 2e année suivant la mise en recouvrement\nDécision admin. : 6 mois (silence = rejet)\nRecours juridictionnel : 2 mois après la décision", "refs": "LPF art. R. 190-1 s.", "f": 3}, {"n": "50.0", "dom": "Droit fiscal", "sub": "Contentieux fiscal", "p": "Rescrit fiscal", "q": "Sécuriser une situation fiscale future ; obtenir une prise de position formelle opposable à l'administration", "ac": "Contribuable, administration fiscale (SIE ou services spécialisés)", "e": "1. Demande écrite, précise, complète et de bonne foi du contribuable\n2. Présentation de la situation de fait en toute transparence\n3. Réponse de l'administration dans 3 mois (6 mois pour certains rescrits spéciaux)\n4. Absence de réponse = accord tacite pour certains rescrits (ex. rescrit entreprise nouvelle, IP Box…)\n5. L'administration est liée par sa réponse positive (garantie LPF art. L. 80 A)", "dl": "Réponse : 3 mois (délai général)\nSilence = accord pour certains rescrits spéciaux", "refs": "LPF art. L. 80 A, L. 80 B", "f": 2}, {"n": "51.0", "dom": "Droit fiscal", "sub": "Contentieux fiscal", "p": "Procédure d'abus de droit fiscal", "q": "Actes fictifs OU actes ayant un but principalement (voire exclusivement) fiscal sans substance économique", "ac": "Administration fiscale, contribuable, comité de l'abus de droit fiscal (CADF)", "e": "1. Proposition de rectification sur le fondement de l'abus de droit\n2. Le contribuable peut saisir le CADF dans 30 jours\n3. Avis consultatif du CADF\n4. Si CADF donne raison à l'administration : pénalité 80 %\n5. Si CADF donne raison au contribuable mais l'admin. maintient : pénalité réduite à 40 %\n6. Charge de la preuve : à l'administration (actes fictifs) ou partagée (but fiscal exclusif/principal)", "dl": "Saisine CADF : 30 jours après la proposition de rectification\nPénalité abus de droit : 80 % (40 % si CADF défavorable à l'admin.)", "refs": "LPF art. L. 64, L. 64 A", "f": 2}, {"n": "52.0", "dom": "Droit fiscal", "sub": "IS & Structures de groupe", "p": "Calcul et paiement de l'IS (régime de droit commun)", "q": "Toute société soumise à l'IS ; exercice comptable clos", "ac": "Entreprise, DGFiP", "e": "1. Calcul du résultat fiscal : résultat comptable ± réintégrations et déductions extra-comptables\n2. Application du taux IS : 25 % (taux normal) ou 15 % pour les PME sur les 42 500 premiers €\n3. Imputation des crédits d'impôt et réductions (CIR, CICE historique…)\n4. Versement de 4 acomptes trimestriels (15 mars, 15 juin, 15 sept., 15 déc.) = chacun ¼ de l'IS N-1\n5. Déclaration du résultat (formulaire 2065) et liasse fiscale dans les 3 mois de la clôture\n6. Paiement du solde (ou remboursement du crédit) lors du dépôt de la déclaration", "dl": "Acomptes : 15/03, 15/06, 15/09, 15/12\nDéclaration & solde : 3 mois après la clôture (ex : 30 avril si clôture 31/12)", "refs": "CGI art. 219, 223 s.", "f": 3}, {"n": "53.0", "dom": "Droit fiscal", "sub": "IS & Structures de groupe", "p": "Report en avant et report en arrière (carry-back) des déficits", "q": "Gestion fiscale des déficits d'une société soumise à l'IS", "ac": "Entreprise, DGFiP", "e": "Report en avant (illimité dans le temps) :\n1. Le déficit N s'impute sur les bénéfices futurs (illimité en durée)\n2. MAIS limité en montant : 1 M€ + 50 % du bénéfice excédant 1 M€ par exercice\n3. Le solde non imputé est reporté sur les exercices suivants\n\nReport en arrière / Carry-back (limité) :\n1. Option expresse lors du dépôt de la déclaration N\n2. Report sur le seul bénéfice de N-1\n3. Montant plafonné au plus petit : déficit N vs bénéfice N-1 (max 1 M€)\n4. Création d'une créance fiscale sur l'État (utilisable sur 5 ans, remboursable au terme)", "dl": "Carry-back : option lors du dépôt de la déclaration N\nCréance carry-back : remboursable après 5 ans si non utilisée", "refs": "CGI art. 209 I et III", "f": 3}, {"n": "54.0", "dom": "Droit fiscal", "sub": "IS & Structures de groupe", "p": "Régime mère-fille", "q": "Éviter la double imposition économique des dividendes versés par une filiale à sa société mère", "ac": "Société mère (holding ou opérationnelle), filiale, DGFiP", "e": "Conditions :\n- Mère soumise à l'IS\n- Participation ≥ 5 % dans le capital de la filiale\n- Détention depuis ≥ 2 ans (ou engagement de conserver 2 ans)\n\nMécanisme :\n1. Les dividendes reçus sont exonérés d'IS chez la mère (quasi-exonération)\n2. Réintégration d'une quote-part de frais et charges (QPFC) de 5 % du dividende brut\n3. Résultat net imposable : 5 % du dividende\n\nProcédure :\n- Aucune option à exercer (de plein droit si conditions remplies)\n- Vérification des conditions à chaque exercice\n- Déclaration sur la liasse fiscale", "dl": "Taux effectif IS sur dividendes : 5 % × taux IS ≈ 1,25 %\nDurée minimale de détention : 2 ans", "refs": "CGI art. 145, 216", "f": 3}, {"n": "55.0", "dom": "Droit fiscal", "sub": "IS & Structures de groupe", "p": "Régime d'intégration fiscale", "q": "Consolider les résultats fiscaux d'un groupe (compensation pertes/bénéfices) ; mère détenant ≥ 95 % des filiales", "ac": "Société mère (tête de groupe), filiales intégrées, DGFiP", "e": "1. Option par la société mère (avant l'ouverture de l'exercice)\n2. Accord préalable des filiales\n3. Durée : 5 ans renouvelables\n4. Chaque société calcule son propre résultat fiscal individuellement\n5. La mère fait la somme algébrique des résultats → résultat d'ensemble\n6. Retraitements obligatoires (dividendes intragroupe, abandons de créances, plus-values internes)\n7. La mère paie l'IS sur le résultat d'ensemble", "dl": "Option : avant l'ouverture de l'exercice\nDurée : 5 ans renouvelables", "refs": "CGI art. 223 A s.", "f": 3}, {"n": "56.0", "dom": "Droit fiscal", "sub": "IS & Structures de groupe", "p": "Prix de transfert", "q": "Transactions intragroupe entre entreprises liées (ventes de biens, prestations de services, redevances, prêts) devant respecter le principe de pleine concurrence", "ac": "Groupe multinational, entreprises liées, DGFiP, administration fiscale étrangère", "e": "1. Entreprises liées réalisant des transactions entre elles\n2. Application du principe de pleine concurrence (arm's length) : conditions identiques à celles pratiquées entre tiers indépendants\n3. Documentation obligatoire (grandes entreprises : CA ≥ 400 M€ ou dans un groupe de même taille)\n4. Lors d'un contrôle : l'administration peut rectifier le résultat en réintégrant les profits transférés\n5. Pénalité spécifique si défaut de documentation : 0,5 % des montants en cause (min 10 000 €)\n6. Accords préalables de prix (APP) possibles pour sécuriser la politique de prix", "dl": "Documentation : disponible lors de toute demande de l'administration\nPrescription contrôle : droit général (3 ans) voire 6 ans en cas de manœuvres frauduleuses", "refs": "CGI art. 57 ; LPF art. L. 13 AA s.", "f": 2}, {"n": "57.0", "dom": "Droit fiscal", "sub": "Plus-values", "p": "Plus-values professionnelles (CT / LT)", "q": "Cession d'immobilisations (corporelles, incorporelles, financières) dans le cadre d'une activité professionnelle ou par une société IS", "ac": "Entreprise cédante, DGFiP", "e": "Régime court terme / long terme pour BIC / BNC (IR) :\n- PVCT (≤ 2 ans de détention ou amortissements) : imposée comme un bénéfice ordinaire\n- PVLT (> 2 ans, hors amortissements) : taux 12,5 % + prélèvements sociaux (ou exonérations PME)\n\nRégime IS :\n- En principe : PVCT et PVLT imposées au taux normal IS\n- Exception : titres de participation (IS) → PVLT exonérée à 88 % (quote-part 12 %)\n\nExonérations PME (IR) :\n- Art. 151 septies : exonération si CA ≤ seuils selon activité, exercice ≥ 5 ans\n- Art. 238 quindecies : exonération lors de la cession de l'entreprise si valeur ≤ 300 000 € (totale) ou ≤ 500 000 € (partielle)\n- Art. 151 septies B : abattement 10 % / an au-delà de 5 ans pour cession d'un immeuble professionnel", "dl": "Délai de détention : détermine CT vs LT\nExonérations : conditions d'exercice et de CA à vérifier", "refs": "CGI art. 39 duodecies s., 150-0 A s., 151 septies, 238 quindecies", "f": 3}, {"n": "58.0", "dom": "Droit social", "sub": "Contrat de travail", "p": "Conclusion du CDD", "q": "Remplacement d'un absent, accroissement temporaire d'activité, emploi saisonnier, usage constant du secteur", "ac": "Employeur, salarié", "e": "1. Vérification du motif de recours (liste limitative)\n2. Rédaction du contrat écrit dans 2 jours ouvrables suivant l'embauche (sanction : requalification)\n3. Clauses obligatoires : motif précis, terme, poste, rémunération\n4. Terme précis ou imprécis selon le motif\n5. Renouvellement : 2 fois max dans la limite de durée totale\n6. Fin de contrat : indemnité de précarité (10 % sauf convention collective) si pas de CDI proposé", "dl": "Contrat écrit : 2 jours ouvrables après l'embauche\nDurée totale (avec renouvellements) : max 18 mois (24 mois à l'étranger)", "refs": "C. trav. art. L. 1242-1 s.", "f": 3}, {"n": "59.0", "dom": "Droit social", "sub": "Contrat de travail", "p": "Requalification d'un CDD en CDI", "q": "Non-respect des règles du CDD : absence d'écrit, motif illicite, dépassement de durée, succession irrégulière, recours à l'intérim pour un emploi permanent", "ac": "Salarié (demandeur), employeur, Conseil de prud'hommes", "e": "1. Saisine du CPH en référé ou au fond par le salarié\n2. Demande de requalification du CDD en CDI\n3. Constatation par le juge du non-respect des conditions légales\n4. Requalification en CDI à la date du 1er CDD irrégulier\n5. Indemnité de requalification : ≥ 1 mois de salaire\n6. Si rupture assimilée à un licenciement sans cause réelle : dommages-intérêts supplémentaires", "dl": "Prescription : 2 ans à compter du terme du CDD\nIndemnité de requalification : ≥ 1 mois de salaire", "refs": "C. trav. art. L. 1245-1 s.", "f": 3}, {"n": "60.0", "dom": "Droit social", "sub": "Contrat de travail", "p": "Modification du contrat de travail", "q": "Changement d'un élément essentiel (rémunération, qualification, horaires substantiels, lieu hors secteur géo.) vs modification des conditions de travail", "ac": "Employeur, salarié", "e": "Modification d'un élément essentiel :\n1. Proposition écrite de l'employeur avec délai de réflexion\n2. Délai : 1 mois (en général) ; 15 jours (motif économique)\n3. Acceptation → avenant signé\n4. Refus → licenciement possible (motif économique ou personnel selon la cause)\n\nChangement des conditions de travail :\n→ L'employeur peut l'imposer unilatéralement (pouvoir de direction)\n→ Refus du salarié = faute pouvant justifier un licenciement pour faute", "dl": "Délai de réflexion : 1 mois (droit commun) / 15 jours (motif éco.)", "refs": "C. trav. art. L. 1222-6", "f": 3}, {"n": "61.0", "dom": "Droit social", "sub": "Rupture du contrat", "p": "Licenciement pour motif personnel (cause réelle et sérieuse)", "q": "Insuffisance professionnelle, absences répétées désorganisant l'entreprise, faute disciplinaire, inaptitude…", "ac": "Employeur, salarié, médecin du travail (inaptitude), DREETS (si salarié protégé)", "e": "1. Convocation à l'entretien préalable (lettre RAR ou remise en main propre) : délai ≥ 5 jours ouvrables avant l'entretien\n2. Entretien préalable (assistance possible par délégué syndical ou conseiller du salarié)\n3. Notification du licenciement par lettre RAR : au plus tôt 2 jours ouvrables après l'entretien\n4. Préavis (sauf faute grave / lourde)\n5. Versement des indemn   draw();
}
function draw(){
  const c=R.deck[R.i],n=R.deck.length,m=(1+Math.min(R.st,5)*.1).toFixed(1);
  const q=(k,t,key)=>`<div class=bq><h3>${t}<small> +5 XP</small></h3>${R.o[k].map((v,i)=>{const a=R.b[k];const cl=a===null?'':v===c[key]?'ok':a===i?'ko':'';return `<button class="o ${cl}" data-k=${k} data-i=${i} ${a!==null?'disabled':''}>${esc(one(v))}</button>`}).join('')}</div>`;
  const mk=k=>R.b[k]===null?'–':R.ok[k]?'✓':'✗';
  const body=R.fl?`<p class=bb>Bonus : article ${mk('a')} · délai ${mk('d')}</p><div class=bk><h3>Quand l'utilise-t-on ?</h3><p>${esc(c.q)}</p><h3>Acteurs clés</h3><p>${esc(c.ac)}</p><h3>Étapes</h3>${lines(c.e)}<h3>Délais importants</h3>${lines(c.dl)}<h3>Références</h3><p>${esc(c.refs)}</p></div><div class=rt><button class="rb r0" data-q=0>1 · Raté</button><button class="rb r1" data-q=1>2 · Hésité</button><button class="rb r2" data-q=2>3 · Maîtrisé</button></div>`
  :q('a','Bonus · Quel article ?','refs')+q('d','Bonus · Quel délai clé ?','dl')+'<button class=pb id=fl>Retourner la carte</button>';
  app.innerHTML=`<div class=hud><button class=x id=qt aria-label="Quitter">✕</button><div class=pg><u style="width:${R.i/n*100}%"></u></div><span>${R.i+1}/${n}</span><span class=xp>${R.xp} XP</span>${R.st>1?`<span class=cb>×${m}</span>`:''}</div>
  <div class=card style="--dc:${COL[c.dom]||'#2d2a6e'}"><div class=band><span>${esc(c.dom)} · ${esc(c.sub)}</span><span>${'★'.repeat(c.f)}</span></div><div class=cbody><h2 class=proc>${esc(c.p)}</h2>${body}</div></div>`;
  $('#qt').onclick=home;
  const f=$('#fl');if(f)f.onclick=()=>{R.fl=true;draw()};
  app.querySelectorAll('.o:not(:disabled)').forEach(b=>b.onclick=()=>{const k=b.dataset.k,i=+b.dataset.i;R.b[k]=i;R.bn++;if(R.o[k][i]===c[k==='a'?'refs':'dl']){R.bo++;R.ok[k]=1}draw()});
  app.querySelectorAll('.rb').forEach(b=>b.onclick=()=>rate(+b.dataset.q));
  scrollTo(0,0);
}
function rate(q){
  if(R.lock)return;R.lock=1;const c=R.deck[R.i];
  R.st=q?R.st+1:0;
  const mu=1+Math.min(R.st,5)*.1,g=Math.round(([0,5,10][q]+5*(R.ok.a+R.ok.d))*mu);
  R.xp+=g;S.xp+=g;S.mast[c.n]=q;R.res[q]++;if(q<2)R.miss.push(c);save();
  const t=document.createElement('div');t.className='toast';t.textContent='+'+g+' XP'+(mu>1?' · combo ×'+mu.toFixed(1):'');document.body.append(t);
  setTimeout(()=>{t.remove();R.i++;R.lock=0;show()},700);
}
function end(){
  const r=rank(S.xp),n=R.deck.length;
  app.innerHTML=`<div class=top><h1>Terminé !</h1><div class=pl><b>${r[1]}</b><span>${S.xp} XP</span></div></div>${r[0]>R.r0?`<p class=up>Nouveau grade : ${r[1]} !</p>`:''}
  <div class=card style="--dc:#2d2a6e"><div class=band><span>Bilan · ${n} cartes</span></div><div class=sum><div><b>+${R.xp}</b><small>XP gagnés</small></div><div><b>${R.res[2]}</b><small>maîtrisées</small></div><div><b>${R.res[1]}</b><small>hésitées</small></div><div><b>${R.res[0]}</b><small>ratées</small></div><div><b>${R.bo}/${R.bn}</b><small>bonus réussis</small></div></div></div>
  ${R.miss.length?`<button class=pb id=rp>Rejouer les ${R.miss.length} cartes à revoir</button>`:''}<button class="pb sec" id=hm>Choisir un autre niveau</button>`;
  const rp=$('#rp');if(rp){const m=R.miss;rp.onclick=()=>start(m)}
  $('#hm').onclick=home;
}
addEventListener('keydown',e=>{
  if(!R||R.i>=R.deck.length||e.key.length>1&&e.key!=='Enter')return;
  if(!R.fl&&(e.key===' '||e.key==='Enter')){e.preventDefault();R.fl=true;draw()}
  else if(R.fl&&'123'.includes(e.key)&&e.key.length===1)rate(+e.key-1);
});
home();
</script></body></html>
